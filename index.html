<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Event Playground</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Welcome to the JS Event Playground! where we turn boring webpages to dynamic, responsive, alive experiences</h1>
  
  <!-- Buttons -->
  <button id="clickBtn">Click Me</button>
  <button id="colorBtn">Change My Color</button>

  <!-- Hover Element -->
  <div id="hoverBox">Hover Over Me</div>

  <!-- Image Gallery -->
  <div class="gallery">
    <img src="https://images.pexels.com/photos/733745/pexels-photo-733745.jpeg?auto=compress&cs=tinysrgb&w=600" class="gallery-img" />
    <img src="https://images.pexels.com/photos/909907/pexels-photo-909907.jpeg?auto=compress&cs=tinysrgb&w=600" class="gallery-img" />
    <img src="https://images.pexels.com/photos/210019/pexels-photo-210019.jpeg?auto=compress&cs=tinysrgb&w=600" class="gallery-img" />
  </div>

  <!-- the Tabs section -->
  <div class="tabs">
    <button class="tab" data-target="content1">Tab 1</button>
    <button class="tab" data-target="content2">Tab 2</button>
    <div id="content1" class="tab-content">This is content for Tab 1</div>
    <div id="content2" class="tab-content">This is content for Tab 2</div>
  </div>

  <!-- My signup from contents -->
  <form id="signupForm">
    <input type="text" id="name" placeholder="Name" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Sign Up</button>
    <p id="formFeedback"></p>
  </form>

  <script src="script.js"></script>
</body>
</html>
